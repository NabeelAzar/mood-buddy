<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'unsafe-inline'; img-src data:" />
    <title>Mood Buddy</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
        font: 13px/1.3 'Segoe UI', system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 8px;
        box-sizing: border-box;
      }
      #bubble {
        position: relative;
        max-width: 190px;
        margin-bottom: 10px;
        padding: 6px 10px;
        border-radius: 12px;
        background: #fff;
        color: #222;
        font-style: italic;
        text-align: center;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      }
      #bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -7px;
        margin-left: -7px;
        border: 7px solid transparent;
        border-bottom: 0;
        border-top-color: #fff;
      }
      #bubble[hidden] {
        display: none;
      }
      #sprite,
      #sprite svg {
        width: 180px;
        height: 180px;
      }
      #sprite svg {
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
      }
    </style>
  </head>
  <body>
    <div id="bubble" hidden></div>
    <div id="sprite"></div>
    <script src="renderer.js"></script>
  </body>
</html>
